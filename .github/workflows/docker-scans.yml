name: Docker Scan

on:
  push:
    branches:
      - main
      - ujjwal000167-containerize-project
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["frontend", "backend"]
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Hadolint scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.image }}/Dockerfile

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build ${{ matrix.image }}
        run: docker build -t ${{ vars.DOCKER_USERNAME }}/university-${{ matrix.image }}:latest .
        working-directory: ${{ matrix.image }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ vars.DOCKER_USERNAME }}/university-${{ matrix.image }}:latest
          format: table
          ignore-unfixed: true
          exit-code: 1
          vuln-type: os,library
          severity: CRITICAL
